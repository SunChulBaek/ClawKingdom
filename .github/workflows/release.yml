name: Release Build

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Decode Keystore
        run: |
          mkdir -p android/keystore
          echo "${{ secrets.BASE64_KEYSTORE }}" | base64 --decode > android/keystore/release.keystore

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/android/keystore/release.keystore
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        run: flutter build apk --release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          name: ClawKingdom ${{ github.ref_name }}
          body: |
            ## ClawKingdom ${{ github.ref_name }}
            
            ⚔️ OpenClaw 에이전트 왕국 - Android 앱
            
            ### 변경 사항
            - 캐릭터 목록 화면 (2열 그리드)
            - 캐릭터 상세 화면 (스탯 바 애니메이션)
            - 왕국 메인 화면
